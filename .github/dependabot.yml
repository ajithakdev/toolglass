# Dependabot configuration for toolglass
# Routine scheduled version updates are disabled (open-pull-requests-limit: 0) to eliminate commit noise and unnecessary churn.
# Dependabot automated security fixes are enabled at the repository level and will continue to automatically open PRs for CVEs and vulnerability alerts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
