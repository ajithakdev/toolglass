server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # /tools/json is served from tools/json.html, like GitHub Pages does
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Hashed bundles never change, so browsers can keep them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The service worker must be re-checked on every visit so updates arrive
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    # Unknown paths get the app shell, which shows the in-app "not found" page
    error_page 404 /404.html;
}
